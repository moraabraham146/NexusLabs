<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NexusLabs - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html"><img src="assets/img/logo.svg" width="32" alt="Logotipo de NexusLabs"> NexusLabs</a>
        <div class="d-flex gap-2 ms-auto">
          <a href="index.html" class="btn btn-outline-secondary btn-sm">Volver</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="d-flex align-items-center justify-content-between mb-4">
        <h1 class="h4 mb-0">Panel de Citas</h1>
        <div class="d-flex align-items-center gap-3">
          <label class="m-0">rol:</label>
          <select id="simulateRole" class="form-select form-select-sm" style="width:160px">
            <option value="patient" selected>Paciente</option>
            <option value="doctor">Médico</option>
          </select>
          <select id="simulateUser" class="form-select form-select-sm" style="width:200px"></select>          <a id="apiStatus" class="ms-2 badge bg-secondary text-white small">API: desconocida</a>        </div>
      </div>

      <div id="alerts"></div>

      <div id="patientView" class="row">
        <div class="col-lg-6">
          <div class="card mb-4 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Solicitar una cita</h5>
              <form id="bookForm">
                <div class="mb-3">
                  <label for="bookName" class="form-label">Nombre</label>
                  <input id="bookName" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="bookUsername" class="form-label">Nombre de usuario</label>
                  <input id="bookUsername" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="bookCedula" class="form-label">Cédula</label>
                  <input id="bookCedula" class="form-control" pattern="\d{6,12}" required>
                </div>
                <div class="mb-3">
                  <label for="bookPhone" class="form-label">Teléfono</label>
                  <input id="bookPhone" class="form-control" pattern="[0-9+\s()-]{6,20}" required>
                </div>
                <div class="mb-3">
                  <label for="bookEmail" class="form-label">Correo</label>
                  <input id="bookEmail" type="email" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="bookDoctor" class="form-label">Selecciona un médico</label>
                  <select id="bookDoctor" class="form-select" required></select>
                </div>
                <div class="mb-3">
                  <label for="bookDatetime" class="form-label">Fecha y hora</label>
                  <input id="bookDatetime" type="datetime-local" class="form-control" required>
                </div>
                <div class="mb-3">
                  <label for="bookReason" class="form-label">Motivo</label>
                  <textarea id="bookReason" class="form-control" rows="2" required></textarea>
                </div>
                <button class="btn btn-primary w-100" type="submit">Solicitar cita</button>
              </form>
            </div>
          </div>

          <div class="card shadow-sm">
            <div class="card-body">
              <h6 class="card-title">Mis citas</h6>
              <div id="myAppointments"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-6">
          <div class="card shadow-sm mb-4">
            <div class="card-body">
              <h5 class="card-title">Historial de solicitudes</h5>
              <div id="allAppointments"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="doctorView" style="display:none">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h5 class="card-title">Solicitudes para mí</h5>
            <div id="doctorAppointments"></div>
          </div>
        </div>
      </div>

    </main>

    <footer class="py-4 bg-light text-center small">
      <div class="container">NexusLabs - Sistema de citas</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
